name: kniephos
description: "MisaTV — 轻量、本地优先的 TVBox 客户端（Flutter 重构）"
publish_to: 'none'
version: 1.1.0+12

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.6
  shared_preferences_platform_interface: ^2.4.2
  path_provider_platform_interface: ^2.1.3
  xml: ^7.1.0
  screen_retriever: ^0.2.2
  window_manager: ^0.5.2
  url_launcher: ^6.3.3
  gbk_codec: ^0.4.0
  video_player: ^2.14.1
  fvp: ^0.39.1
  path_provider: ^2.1.6
  flutter_js: ^0.8.7
  crypto: ^3.0.8
  path: ^1.9.1
  archive: ^4.0.7
  flutter_inappwebview: ^6.1.5
  pointycastle: ^4.0.0
  file_selector: ^1.1.0
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1
  json_path: ^0.9.0
  html: ^0.15.7
  tray_manager: ^0.8.2
  hotkey_manager: ^0.3.0
  desktop_multi_window: ^0.3.1
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Demibold.ttf
          weight: 600
        - asset: assets/fonts/MiSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/MiSans-Heavy.ttf
          weight: 800
  assets:
    - assets/images/
    - assets/js_lib/
    - assets/python_runner/
    - assets/python_runner/base/
    - assets/jvm/
    - assets/jvm/shell-real/
    - assets/aria2/
